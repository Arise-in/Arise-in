name: Comet Contribution Graph

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render cinematic contribution graph
        uses: kiaquila/comet-contribution-graph@v1
        with:
          username: Arise-in
